// Minimal self-contained subset of MEXC's websocket-proto definitions.
// Source: https://github.com/mexcdevelop/websocket-proto
// Only the messages/fields this app decodes are kept. Field numbers are
// preserved exactly so the wire format matches MEXC's push frames.

syntax = "proto3";

// spot@public.kline.v3.api.pb@<symbol>@<interval>
message PublicSpotKlineV3Api {
  string interval      = 1;  // Min1,Min5,Min15,Min30,Min60,Hour4,Hour8,Day1,Week1,Month1
  int64  windowStart   = 2;  // window start (unix seconds)
  string openingPrice  = 3;
  string closingPrice  = 4;
  string highestPrice  = 5;
  string lowestPrice   = 6;
  string volume        = 7;  // base volume
  string amount        = 8;  // quote volume
  int64  windowEnd     = 9;  // window end (unix seconds)
}

// spot@public.aggre.deals.v3.api.pb@<interval>@<symbol>
message PublicAggreDealsV3ApiItem {
  string price     = 1;
  string quantity  = 2;
  int32  tradeType = 3;  // 1 = buy, 2 = sell
  int64  time      = 4;  // unix ms
  string tradeId   = 5;
}

message PublicAggreDealsV3Api {
  repeated PublicAggreDealsV3ApiItem deals = 1;
  string eventType = 2;
}

// Outer wrapper for every binary push frame. Declared as plain optional
// fields (not a oneof) - the wire format is identical and protobufjs
// decodes it the same way.
message PushDataV3ApiWrapper {
  string channel                       = 1;
  string symbol                        = 3;
  string symbolId                      = 4;
  int64  createTime                    = 5;
  int64  sendTime                      = 6;
  PublicSpotKlineV3Api  publicSpotKline = 308;
  PublicAggreDealsV3Api publicAggreDeals = 314;
}

services:
  btczig:
    build: .
    image: btczig-peg:latest
    container_name: btczig

    # BIND controls exposure, HOST_PORT the port. Defaults are loopback-only.
    #   BIND=127.0.0.1  -> reachable only from the server itself (safe default)
    #   BIND=0.0.0.0    -> reachable from the internet; see the warning in .env.example
    # Set both in a .env file next to this one.
    ports:
      - "${BIND:-127.0.0.1}:${HOST_PORT:-5173}:5173"

    # ledger + simulated bars live here, so `docker compose down && up` resumes
    volumes:
      - ./state:/app/state

    environment:
      PORT: "5173"
      HOST: "0.0.0.0"      # must be 0.0.0.0 inside the container for the port map to work
      REPORT_MIN: "30"     # match report to the log every N minutes
      TZ: "UTC"
      # 1 = block POST /api/engine. Set this whenever the URL is shared, so a
      # viewer cannot reconfigure or reset a run that is being measured.
      READONLY: "${READONLY:-0}"
      # Engine tuning, applied at startup. Needed because READONLY=1 blocks
      # POST /api/engine, so .env is the only way to configure a shared server.
      # Empty values are ignored and the built-in default is used.
      ENGINE_TRACKMODE: "${ENGINE_TRACKMODE:-}"
      ENGINE_TRACKBETA: "${ENGINE_TRACKBETA:-}"
      ENGINE_MAXPARTICIPATION: "${ENGINE_MAXPARTICIPATION:-}"
      ENGINE_GAIN: "${ENGINE_GAIN:-}"
      ENGINE_FEEDFORWARD: "${ENGINE_FEEDFORWARD:-}"
      ENGINE_CAPITALUSDT: "${ENGINE_CAPITALUSDT:-}"
      ENGINE_WASHENABLED: "${ENGINE_WASHENABLED:-}"

    restart: unless-stopped
    stop_grace_period: 20s  # room to flush state and print the final report

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # TLS + auth front door. Only starts with the "tls" profile:
  #     docker compose --profile tls up -d
  # Set BIND=127.0.0.1 in .env when using this, so the app is reachable only
  # through Caddy and never directly.
  caddy:
    image: caddy:2-alpine
    container_name: btczig-caddy
    profiles: ["tls"]
    depends_on: [btczig]
    ports:
      # One port, same inside and out, so SITE_ADDRESS can name it directly.
      # 443 gets a real Let's Encrypt cert. Any other port cannot (both ACME
      # challenges require 80 or 443), so Caddy falls back to its internal CA:
      # still encrypted and password-protected, but browsers warn once.
      - "${CADDY_PORT:-443}:${CADDY_PORT:-443}"
    environment:
      # Plain defaults, not "${VAR:?}" -- the required-variable form is evaluated
      # for the whole file even when this profile is not active, which breaks
      # every other compose command on a host with no .env.
      SITE_ADDRESS: "${SITE_ADDRESS:-http://:8888}"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-admin}"
      BASIC_AUTH_HASH: "${BASIC_AUTH_HASH:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates live here - keep this volume
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
